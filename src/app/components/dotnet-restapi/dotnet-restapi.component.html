<div class="container">

  <!-- Error -->
  <div *ngIf="hasError(); else usersTable" class="users-table d-flex align-items-center justify-content-center">
    <p class="text-danger"><strong>Error fetching data from the server</strong></p>
  </div>

  <!-- Users Table -->
  <ng-template #usersTable>
    <div class="users-table">

      <div class="headers">
        <h2 class="table-title">User operations from backend ---> (.NET Core API)</h2>
        <button class="btn add" (click)="openForm()">Add User</button>
      </div>

      <!-- No Data Message -->
      <div *ngIf="!hasData()" class="text-center">
        <p>No users found</p>
      </div>

      <!-- Users Table -->
      <table class="table" *ngIf="hasData()">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th></th>
            <th></th>
          </tr>
        </thead>

        <tbody class="text-center">
          <tr *ngFor="let user of users">
            <td>{{ user.id || 'N/A' }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>

            <td>
              <button class="btn btn-primary" (click)="openForm(user)">Edit</button>
            </td>

            <td>
              <button class="btn btn-danger" (click)="deleteUser(user.id || null)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>

    </div>
  </ng-template>

  <!-- Add/Edit Form -->
  <div class="form-wrapper" *ngIf="showForm">
    <div class="users-form">

      <h2 class="text-center text-info">{{ formHeader }}</h2>

      <div class="group">
        <label>Username:</label>
        <input type="text" class="form-control" [(ngModel)]="username" placeholder="Enter username">
      </div>

      <div class="group">
        <label>Email:</label>
        <input type="email" class="form-control" [(ngModel)]="email" placeholder="Enter email">
      </div>

      <div class="action">
        <button class="btn btn-danger" (click)="closeForm()">Cancel</button>
        <button class="btn btn-success" (click)="saveUser()">Save</button>
      </div>

    </div>
  </div>

</div>
